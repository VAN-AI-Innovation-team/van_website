name: Deploy to Vercel

# Vercel의 GitHub 연동이 이 저장소를 구독하지 않아 푸시가 배포로 이어지지 않습니다.
# 이 워크플로는 반대 방향으로 동작합니다. Vercel이 GitHub를 당겨오는 대신,
# GitHub Actions가 Vercel로 배포를 밀어넣습니다.
#
# 활성화 방법 — 아래 둘 중 하나만 등록하면 됩니다.
#
#   1) VERCEL_DEPLOY_HOOK_URL  (권장, 값 1개)
#      Vercel → 프로젝트 → Settings → Git → Deploy Hooks에서
#      브랜치 main으로 훅을 만들고 생성된 URL을 저장소 Secret으로 등록합니다.
#
#   2) VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID  (값 3개)
#      토큰: Vercel → Account Settings → Tokens
#      ID  : Vercel → 프로젝트 → Settings → General 하단, 또는 로컬에서
#            `npx vercel link` 실행 후 생성되는 .vercel/project.json
#
# 둘 다 없으면 이 워크플로는 아무것도 하지 않고 성공으로 끝납니다(CI를 깨지 않음).
# 등록 위치: 저장소 Settings → Secrets and variables → Actions → New repository secret

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 배포는 겹치면 안 되므로 직렬화합니다. 진행 중인 배포를 취소하지 않습니다.
concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Detect available credential
        id: cred
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            echo 'mode=hook' >> "$GITHUB_OUTPUT"
          elif [ -n "$TOKEN" ]; then
            echo 'mode=cli' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=none' >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no credential configured)
        if: steps.cred.outputs.mode == 'none'
        run: |
          echo "::notice title=배포 건너뜀::VERCEL_DEPLOY_HOOK_URL 또는 VERCEL_TOKEN 시크릿이 없어 배포하지 않았습니다. .github/workflows/deploy.yml 상단 주석에 등록 방법이 있습니다."

      # ── 경로 1: Deploy Hook ────────────────────────────────────────────
      - name: Trigger Vercel deploy hook
        if: steps.cred.outputs.mode == 'hook'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          status=$(curl --silent --show-error --location \
            --request POST "$HOOK_URL" \
            --output hook-response.json \
            --write-out '%{http_code}')
          echo "HTTP $status"
          cat hook-response.json || true
          echo
          case "$status" in
            200|201) echo "::notice title=배포 트리거됨::Vercel이 빌드를 시작했습니다. 완료까지 1~2분 걸립니다." ;;
            *) echo "::error title=배포 트리거 실패::훅이 HTTP $status 를 반환했습니다. URL이 만료되었거나 잘못되었을 수 있습니다."; exit 1 ;;
          esac

      # ── 경로 2: Vercel CLI ─────────────────────────────────────────────
      - name: Check out repository
        if: steps.cred.outputs.mode == 'cli'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.cred.outputs.mode == 'cli'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Deploy with Vercel CLI
        if: steps.cred.outputs.mode == 'cli'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error title=ID 누락::VERCEL_TOKEN은 있지만 VERCEL_ORG_ID / VERCEL_PROJECT_ID가 없습니다."
            exit 1
          fi
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "배포 URL: $url"
          echo "::notice title=배포 완료::$url"
